    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body { margin: 0; font-family: sans-serif; }

    </style>

<body>

    <model-viewer id="my-model" src="ชื่อไฟล์ของคุณครู.glb" ar ar-modes="webxr scene-viewer quick-look" camera-controls shadow-intensity="1">
        <button class="btn-chat" id="askBtn">กดเพื่อถามครู AI</button>
    </model-viewer>

    <script>
        const API_KEY = "วาง_API_KEY_ที่คัดลอกมาตรงนี้";
        const btn = document.getElementById('askBtn');

        btn.onclick = async () => {
            const q = prompt("นักเรียนอยากถามอะไรครับ?");
            if(!q) return;
            btn.innerText = "กำลังคิด...";

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: `คุณคือครูใจดี ตอบเป็นภาษาไทยสั้นๆ: ${q}` }] }] })
                });
                const data = await res.json();
                const text = data.candidates[0].content.parts[0].text;
                
                alert("ครู AI: " + text);
                const speech = new SpeechSynthesisUtterance(text);
                speech.lang = 'th-TH';
                window.speechSynthesis.speak(speech);
            } catch (e) {
                alert("เกิดข้อผิดพลาด: ลองเช็ก API Key หรืออินเทอร์เน็ตครับ");
            } finally {
                btn.innerText = "กดเพื่อถามครู AI";
            }
        };
    </script>
</body>
